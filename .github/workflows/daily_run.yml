name: Run Daily Batch Job

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 매일 UTC 23:00 (한국 시간 오전 8시)에 실행

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # ★★★ 이 부분을 추가하세요 ★★★
    permissions:
      contents: write # 저장소에 코드를 쓸 수 있는 권한 부여

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Batch Script
        run: |
          python run_local_batch.py

      - name: Commit and Push new data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "📊 Daily data update" || echo "No changes to commit"
          git push