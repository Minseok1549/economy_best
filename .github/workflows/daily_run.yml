name: Run Daily Batch Job

on:
  workflow_dispatch: # 수동으로 실행할 수 있도록 버튼 추가
  schedule:
    - cron: "0 23 * * *" # 매일 UTC 23:00 (한국 시간 오전 8시)에 실행

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # requirements.txt에 맞는 파이썬 버전

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Batch Script
        run: |
          python run_local_batch.py

      - name: Commit and Push new data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "📊 Daily data update" || echo "No changes to commit"
          git push