# GitHub Actions 워크플로우 설정 파일

name: Daily Data Update

on:
  workflow_dispatch: # 수동 실행을 위한 버튼 추가
  schedule:
    - cron: '0 23 * * *' # 매일 UTC 23시 (한국 시간 오전 8시)에 실행

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 사용하는 파이썬 버전

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training script
        run: python ./train_models.py # 모델도 매일 재학습

      - name: Run forecast script
        run: python ./generate_forecasts.py # 최신 예측 데이터 생성

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add saved_models/
          git add *_forecast.csv
          # 변경 사항이 있을 때만 커밋하도록 설정
          git diff-index --quiet HEAD || git commit -m "📈 Daily data and model update"
          git push